---
# yamllint disable rule:line-length
name: shellcheck
'on':
  push:
    branches:
      - master
    paths:
      - '**.sh'
      - '**.bash'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches:
      - master
    paths:
      - '**.sh'
      - '**.bash'
      - '.github/workflows/shellcheck.yml'
jobs:
  shellcheck:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ludeeus/action-shellcheck@master
